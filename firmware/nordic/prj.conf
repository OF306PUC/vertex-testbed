# ─────────────────────────────────────────────────────────────────────────────
# Coordination agent: the control law runs here; the Pi relays.
#
#   Pi ──UART N/A/D/S/R──► this board runs the law ──BLE──► neighbours
#      ◄──UART STATE──────
# ─────────────────────────────────────────────────────────────────────────────

# ── uart0 belongs to the protocol, and nothing else ──────────────────────────
# Both of these default to ON and write to uart0. Interleaved text corrupts
# binary frames in a way that looks like a link fault: the parser resynchronises
# on the next SOF and reports CRC errors, so the symptom points at the cable.
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n

# Logging over RTT, not UART. Previously CONFIG_LOG=n, which compiled every
# LOG_INF/LOG_WRN in this firmware to nothing -- including the scan totals and
# the selected TX power, which are the only place those numbers surface.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_RTT_CONSOLE=y

# ── UART: UARTE0 through the async (DMA) API ─────────────────────────────────
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# Hardware byte counting, and the timer it needs. NOT optional, and its absence
# fails silently: without it the UARTE driver cannot tell how many bytes are in
# the DMA buffer before that buffer fills, so the RX idle timeout never fires and
# a short frame sits in DMA indefinitely. Configuration frames are all short, so
# the board would accept nothing and look like a dead link. The loopback peers
# have carried this since direction A; this firmware did not.
CONFIG_UART_0_NRF_HW_ASYNC=y
CONFIG_UART_0_NRF_HW_ASYNC_TIMER=2

CONFIG_RING_BUFFER=y

# ── Bluetooth ────────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="LABCTRL"
CONFIG_BT_BROADCASTER=y             # broadcaster.c: publish this agent's vstate
CONFIG_BT_OBSERVER=y                # observer.c: receive the neighbours'

# ── board support ────────────────────────────────────────────────────────────
CONFIG_DK_LIBRARY=y                 # dk_set_led: the status blink in main.c

# ── stacks ───────────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048
