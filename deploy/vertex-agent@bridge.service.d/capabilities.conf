# The bridge, and only the bridge, binds the HCI user channel -- exclusive and
# root-only. This drop-in is the reason to prefer systemd over `setcap python3`:
# the capability lands on one unit instead of on every python3 process the host
# will ever run.
#
# CAP_NET_RAW  opens the AF_BLUETOOTH SOCK_RAW socket
# CAP_NET_ADMIN binds it to HCI_CHANNEL_USER
[Service]
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW

# BlueZ must not hold the adapter: the user channel is exclusive, and bluetoothd
# holding hci0 is the EBUSY that looks like a missing adapter.
Conflicts=bluetooth.service
After=bluetooth.service
ExecStartPre=/usr/bin/hciconfig hci0 down
