[project]
name = "vertex"
version = "0.1.0"
description = "Testbed for distributed and multi-agent control over real heterogeneous radio links"
requires-python = ">=3.11"
# pyserial is required, not optional: a `ble` agent relays to an nRF over a serial
# port and cannot start without it. The import stays lazy inside SerialLink.open(),
# so a `wifi` agent never loads it -- but "not imported on every path" is not the
# same as "not needed", and leaving it undeclared made the install instructions
# quietly incomplete: wifi and bridge came up, ble died with ModuleNotFoundError.
dependencies = [
    "numpy>=1.26", "pydantic>=2.7", "networkx>=2.8", "pyyaml>=6.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]

[project.optional-dependencies]
# Nothing extra is needed to run an agent, a hub, a simulation, or the tests. The
# control plane is stdlib asyncio, so ten Raspberry Pis install no web stack.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests", "validation"]
addopts = "-q --strict-markers"

[tool.setuptools.packages.find]
include = ["vertex*"]
