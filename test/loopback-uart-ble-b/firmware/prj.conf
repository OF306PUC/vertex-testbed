# ─────────────────────────────────────────────────────────────────────────────
# Loopback test B — the peer TRANSMITS.
#
#   Pi ──UART 'T'──► peer advertises verbatim ──BLE──► Pi scans (raw HCI)
#
# This is the direction that validates the Pi's SCANNING path -- the scan
# interval and window BlueZ never exposed. The peer is reduced to a commanded
# advertiser, so its config drops everything receive-side: less running on the
# board means fewer explanations for a result.
# ─────────────────────────────────────────────────────────────────────────────

# ── uart0 belongs to the protocol, and nothing else ──────────────────────────
# See test A's config: both of these default to ON and write to uart0, and
# interleaved text corrupts binary frames in a way that looks like a link fault.
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_RTT_CONSOLE=y

# ── UART ─────────────────────────────────────────────────────────────────────
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# Same silent-failure option as test A. It matters MORE here: direction B's
# inbound traffic is one 'T' frame per transmission and nothing else, so there
# is never any later traffic to top up a stalled DMA buffer. Without byte
# counting the peer would advertise the first payload and then appear to freeze.
CONFIG_UART_0_NRF_HW_ASYNC=y
CONFIG_UART_0_NRF_HW_ASYNC_TIMER=2

CONFIG_RING_BUFFER=y

# ── Bluetooth ────────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y             # advertising: the point of direction B
CONFIG_BT_OBSERVER=y                # only so the shared source links
CONFIG_BT_DEVICE_NAME="VERTEX-PEER"

# Advertising cadence is the reference the Pi's scan-window sweep is measured
# against, so it must be exact. bt_le_adv_update_data() replaces the payload
# without restarting the advertiser, which is what keeps the interval stable
# across a run.
CONFIG_BT_EXT_ADV=y
CONFIG_BT_CTLR_ADV_EXT=y

# NOTE -- channel map is NOT settable from config, and not from Zephyr's
# bt_le_adv_param either: the struct has no channel-map field, with or without
# extended advertising. Restricting the peer to channel 39 (2480 MHz, clear of
# Wi-Fi 1/6/11) needs a raw HCI command from the firmware -- the same
# bt_hci_cmd_send_sync() pattern that set_tx_power() uses in broadcaster.c.
# Until then the peer advertises on all three and only the Pi's channel map is
# controllable. See ble_scan.c's ble_adv_start(), which accepts chan_map and
# currently ignores it.

# ── stacks ───────────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048
