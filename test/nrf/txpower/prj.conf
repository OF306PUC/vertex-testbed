# ─────────────────────────────────────────────────────────────────────────────
# TX power probe — can this board actually be set to +8 dBm, and what does it
# report back?
#
# Unlike the production firmware, this logs over UART, NOT RTT. The production
# app keeps uart0 exclusively for the binary frame protocol, so its logs go to
# RTT and a serial monitor shows nothing readable. This app has no protocol on
# uart0, so it can use the console -- which is the whole point: plug in, open a
# serial monitor at 115200, press reset, read the answer.
# ─────────────────────────────────────────────────────────────────────────────
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_CENTRAL=n
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=n

# The Nordic vendor HCI commands, including Write Tx Power Level. Without this
# the command is not compiled in and the probe cannot run at all.
CONFIG_BT_HCI_VS=y

# WITHOUT THIS the vendor Write Tx Power Level command (0xfc0e) is not compiled
# into the SoftDevice Controller, which answers status 0x01 "Unknown HCI Command".
# Measured on hardware 2026-08-26: every request failed with err -5, including the
# +8 dBm the production firmware asks for at every run trigger.
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y

# The static alternative, for reference: one value fixed at build time, no runtime
# call, and it does not depend on the vendor command at all. Requesting a value the
# hardware cannot produce yields the next lower supported one.
# CONFIG_BT_CTLR_TX_PWR_ANTENNA=8
