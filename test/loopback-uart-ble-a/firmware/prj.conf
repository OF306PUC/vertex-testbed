# ─────────────────────────────────────────────────────────────────────────────
# Loopback test A — the peer RECEIVES.
#
#   Pi advertises ──BLE──► peer scans ──UART──► Pi
#
# The peer's job is to miss nothing and report everything, so this config is
# tuned for receive throughput. Its own advertiser stays off (run_a.py sends
# advertising=False); it is compiled in only because the shared source calls
# bt_le_adv_start().
# ─────────────────────────────────────────────────────────────────────────────

# ── uart0 belongs to the protocol, and nothing else ──────────────────────────
# Both of these default to ON and both write to uart0. Console output or log
# text interleaved with binary frames corrupts them, and the CRC then rejects
# frames that were never damaged on the wire -- which reads as a link fault.
# The nRF52-DK has an onboard J-Link, so RTT costs nothing and keeps uart0 clean.
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y          # never log from the BLE RX or UART callback
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_RTT_CONSOLE=y
# read it with:  JLinkRTTLogger  /  nrfjprog --rtt  /  west attach

# ── UART ─────────────────────────────────────────────────────────────────────
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# THE option that fails silently if omitted. A dedicated TIMER counts received
# bytes via PPI, which is the only way the async driver can flush a PARTIAL DMA
# buffer on the idle timeout rather than waiting for 256 bytes. Without it a
# 42-byte config frame sits in the buffer until unrelated traffic tops it up,
# and commands appear to be ignored at random.
#
# Verify at runtime: query 'Q' and read rx_partial_flushes. Zero after the host
# has sent frames means this is not active.
#
# TIMER0 belongs to the BLE controller; TIMER2 is free.
CONFIG_UART_0_NRF_HW_ASYNC=y
CONFIG_UART_0_NRF_HW_ASYNC_TIMER=2

CONFIG_RING_BUFFER=y

# ── Bluetooth ────────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_OBSERVER=y                # scanning: the point of direction A
CONFIG_BT_BROADCASTER=y             # only so the shared source links
CONFIG_BT_DEVICE_NAME="VERTEX-PEER"

# Report throughput. Every advertising report crosses the controller-to-host
# boundary through these buffers; too few and the CONTROLLER drops reports,
# which is invisible to us and indistinguishable from radio loss.
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_EVT_RX_SIZE=255
# the scan callback runs on this stack
CONFIG_BT_RX_STACK_SIZE=2048

# ── stacks ───────────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048
